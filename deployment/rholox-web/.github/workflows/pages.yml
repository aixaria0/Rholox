name: Rholox | Free Static Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rholox-pages
  cancel-in-progress: false
jobs:
  build:
    name: Build and audit public site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
      - name: Checkout original Rholox source
        uses: actions/checkout@v4
        with:
          repository: aixaria0/Rholox
          ref: main
          persist-credentials: false
          path: rholox-source
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rholox-source/package-lock.json
      - name: Install dependencies
        working-directory: rholox-source
        run: npm ci --no-audit --no-fund
      - name: Verify upstream source
        working-directory: rholox-source
        run: npm run verify
      - name: Strip server-only artifacts
        run: node scripts/check-static-output.mjs rholox-source/dist
      - name: Record upstream commit
        working-directory: rholox-source
        run: git rev-parse HEAD > dist/upstream-commit.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload release artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: rholox-source/dist
  deploy:
    name: Publish static release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
