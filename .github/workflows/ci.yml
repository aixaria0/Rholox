name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and production build
        run: npm run verify

      - name: Audit production dependency tree
        run: npm audit --audit-level=high

      - name: Upload reviewed static build
        uses: actions/upload-artifact@v4
        with:
          name: rholox-static-site
          path: dist/
          if-no-files-found: error
